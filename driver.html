<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Repartidor - Mandaditos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="margin: 0; font-size: 22px;">🛵 Panel de Repartidor</h1>
            <button onclick="logout()" style="width: auto; padding: 6px 12px; background: #64748b; font-size: 12px; color: white; border: none; border-radius: 6px; cursor: pointer;">Cerrar Sesión</button>
        </div>

        <p id="driverWelcome" style="font-weight: 600; color: var(--success-color); margin-bottom: 20px;"></p>

        <h2>Bolsa de Pedidos Disponibles</h2>
        <div id="availableOrdersList">Buscando mandaditos cercanos...</div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        
        // Verificar que haya sesión de repartidor activa
        const username = localStorage.getItem("username");
        const role = localStorage.getItem("role");

        if (!username || role !== "driver") {
            window.location.href = "index.html";
        } else {
            document.getElementById("driverWelcome").innerText = `Repartidor en ruta: ${username}`;
            loadAvailableOrders();
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        async function loadAvailableOrders() {
            try {
                const response = await fetch(`${API_URL}/orders/pending`);
                const data = await response.json();
                const container = document.getElementById("availableOrdersList");
                
                if (data.pending_orders.length === 0) {
                    container.innerHTML = "<p class='empty-state'>No hay mandaditos disponibles por ahora. ¡Vuelve más tarde!</p>";
                    return;
                }

                container.innerHTML = "";
                data.pending_orders.forEach(order => {
                    const card = document.createElement("div");
                    card.className = "order-card";
                    card.innerHTML = `
                        <strong>De: ${order.client_name} (Pedido #${order.id})</strong>
                        <p><strong>Encargo:</strong> ${order.description}</p>
                        <p><strong>Recoger en:</strong> ${order.pickup_location}</p>
                        <p><strong>Entregar en:</strong> ${order.delivery_location}</p>
                        <p><strong>Ganancia:</strong> <span style="color: var(--success-color); font-weight: bold;">$${order.reward.toFixed(2)}</span></p>
                        <button class="btn-complete" onclick="acceptOrder(${order.id})">Tomar y Completar Pedido</button>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error cargando bolsa:", error);
            }
        }

        async function acceptOrder(orderId) {
            try {
                const response = await fetch(`${API_URL}/orders/${orderId}/status?status=completado`, {
                    method: "PATCH"
                });

                if (response.ok) {
                    alert("¡Has completado el mandadito con éxito!");
                    loadAvailableOrders();
                } else {
                    alert("Error al actualizar el estado.");
                }
            } catch (error) {
                console.error("Error:", error);
            }
        }
    </script>
</body>
</html>
