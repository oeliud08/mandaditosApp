<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cliente - Mandaditos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="margin: 0; font-size: 22px;">👤 Panel de Cliente</h1>
            <button onclick="logout()" style="width: auto; padding: 6px 12px; background: #64748b; font-size: 12px; color: white; border: none; border-radius: 6px; cursor: pointer;">Cerrar Sesión</button>
        </div>

        <p id="clientWelcome" style="font-weight: 600; color: var(--primary-color); margin-bottom: 20px;"></p>

        <h2>Registrar Nuevo Pedido</h2>
        <form id="orderForm">
            <div class="form-group">
                <label>Descripción del encargo:</label>
                <textarea id="description" placeholder="Ej. 1 kilo de tortillas y refresco" required></textarea>
            </div>
            <div class="form-group">
                <label>Lugar de recolección:</label>
                <input type="text" id="pickup_location" placeholder="Ej. Tortillería Local" required>
            </div>
            <div class="form-group">
                <label>Lugar de entrega:</label>
                <input type="text" id="delivery_location" placeholder="Ej. Calle Principal #10" required>
            </div>
            <div class="form-group">
                <label>Recompensa ($):</label>
                <input type="number" step="0.01" id="reward" placeholder="Ej. 35.00" required>
            </div>
            <button type="submit">Publicar Mandadito</button>
        </form>

        <h2>Mis Pedidos Activos</h2>
        <div id="clientOrdersList">Cargando tus pedidos...</div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        
        // Verificar que haya sesión de cliente activa
        const username = localStorage.getItem("username");
        const role = localStorage.getItem("role");

        if (!username || role !== "client") {
            window.location.href = "index.html"; // Si no es cliente, fuera
        } else {
            document.getElementById("clientWelcome").innerText = `Bienvenido, ${username}`;
            loadClientOrders();
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        async function loadClientOrders() {
            try {
                const response = await fetch(`${API_URL}/orders/pending`);
                const data = await response.json();
                const container = document.getElementById("clientOrdersList");
                
                if (data.pending_orders.length === 0) {
                    container.innerHTML = "<p class='empty-state'>No tienes pedidos activos en este momento.</p>";
                    return;
                }

                container.innerHTML = "";
                data.pending_orders.forEach(order => {
                    const card = document.createElement("div");
                    card.className = "order-card";
                    card.innerHTML = `
                        <strong>Pedido #${order.id}</strong>
                        <p><strong>Qué:</strong> ${order.description}</p>
                        <p><strong>Entrega en:</strong> ${order.delivery_location}</p>
                        <p><strong>Recompensa:</strong> $${order.reward.toFixed(2)}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error cargando pedidos:", error);
            }
        }

        document.getElementById("orderForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const newOrder = {
                client_name: username,
                description: document.getElementById("description").value,
                pickup_location: document.getElementById("pickup_location").value,
                delivery_location: document.getElementById("delivery_location").value,
                reward: parseFloat(document.getElementById("reward").value)
            };

            try {
                const response = await fetch(`${API_URL}/orders/`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(newOrder)
                });

                if (response.ok) {
                    alert("¡Mandadito publicado con éxito!");
                    document.getElementById("orderForm").reset();
                    loadClientOrders();
                } else {
                    alert("Error al crear el pedido.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("No se pudo conectar con el servidor.");
            }
        });
    </script>
</body>
</html>
